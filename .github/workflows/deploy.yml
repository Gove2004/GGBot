name: deploy

# push 到 master 就同步代码到云服务器并重启；也可在 Actions 页手动触发。
# 需要在仓库 Secrets 里配（Settings → Secrets and variables → Actions → New repository secret）：
#   DEPLOY_SSH_KEY   部署专用 SSH 私钥（私钥只存 GitHub，公钥写进服务器 authorized_keys）
#   DEPLOY_SSH_HOST  服务器地址，如 1.2.3.4
#   DEPLOY_SSH_USER  登录用户，不填按 root
#   DEPLOY_SSH_PATH  项目目录，不填按 /root/GGBot
#   DEPLOY_SSH_PORT  SSH 端口，不填按 22
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PATH: ${{ secrets.DEPLOY_SSH_PATH }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Secrets
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "缺少 secret: DEPLOY_SSH_KEY"; exit 1; }
          [ -n "$DEPLOY_SSH_HOST" ] || { echo "缺少 secret: DEPLOY_SSH_HOST"; exit 1; }

      - name: 写入 SSH 私钥并记录主机指纹
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_SSH_PORT:-22}" \
              "${DEPLOY_SSH_USER:-root}@${DEPLOY_SSH_HOST}" \
              "test -d '${DEPLOY_SSH_PATH:-/root/GGBot}' && echo remote-ok"

      - name: 同步代码（跳过密钥与运行时数据）
        run: |
          # 清单只有一份：deploy/rsync-filter.txt（CI 与手工同步共用），用的是 rsync 的 filter 规则语法——
          # 每行 `- 模式` 排除、`+ 模式` 放行。别改回 --exclude-from：那份语法里的 `!` 放行行实测不生效
          # （rsync 3.2.7 会把 tool/emoji/ 整个内容排掉，表情工具代码同步不上去），条目理由写在 README「部署到云服务器」。
          # 为什么必须排除：这些文件在服务器上有、在 CI 的 checkout 里没有（.gitignore 挡掉了），
          # 而 --delete 会把"服务器有、源没有"的文件删掉——不排除就等于每次部署清一遍密钥和数据库。
          # 被排除的条目同时受 --delete 保护，不会被清空：表情库/语音素材/库备份都留在服务器上。
          # 顺序有意义：rsync 取首个匹配生效（和 .gitignore 的最后匹配相反），两行 `+` 必须排在 `- tool/emoji/**` 前面，
          # 这个口径由 temp/test_deploy_scripts.py 盯着。
          rsync -az --delete --filter="merge deploy/rsync-filter.txt" \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_SSH_PORT:-22}" \
            ./ "${DEPLOY_SSH_USER:-root}@${DEPLOY_SSH_HOST}:${DEPLOY_SSH_PATH:-/root/GGBot}/"

      - name: 远端重启并做健康检查
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_SSH_PORT:-22}" \
              "${DEPLOY_SSH_USER:-root}@${DEPLOY_SSH_HOST}" \
              "bash '${DEPLOY_SSH_PATH:-/root/GGBot}/deploy/deploy_server.sh'"
